<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .paper { fill: #FDFDF8; }
      .sketch-line { fill: none; stroke: #1A1A1A; stroke-linecap: round; stroke-linejoin: round; }
      .sketch-thin { fill: none; stroke: #1A1A1A; stroke-linecap: round; }
      .accent-fill { fill: #DCE35B; }
      .text-agl { fill: #1A1A1A; font-family: 'Georgia', 'Times New Roman', serif; font-size: 56px; font-weight: bold; letter-spacing: 10px; }
      .text-sub { fill: #5C5A64; font-family: 'Aref Ruqaa', 'Amiri', serif; font-size: 16px; }
      .text-en { fill: #9C9AA2; font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 10px; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- ورقة بيضاء -->
  <rect width="500" height="500" class="paper" rx="12"/>

  <!-- ═══ الدماغ: رسم قلم رصاص أسود على ورقة ═══ -->
  <g transform="translate(250,185)">

    <!-- الشكل الخارجي: خط يدوي غير مثالي بسمك متغير -->
    <path class="sketch-line" stroke-width="2.8" opacity="0.85"
          d="M-95,-5 C-102,-50 -72,-88 -35,-96 C-10,-101 20,-97 45,-85 C75,-70 95,-42 92,-10 C90,15 78,38 55,50 C30,58 -5,58 -40,50 C-70,42 -93,20 -95,-5 Z"/>

    <!-- الخط الفاصل الأوسط -->
    <path class="sketch-thin" stroke-width="1.2" opacity="0.35"
          d="M0,-94 C3,-60 1,-25 0,15 C-1,35 0,48 0,52"/>

    <!-- تجاعيد الدماغ — خطوط رفيعة بتدرج سماكة يحاكي ضغط القلم -->

    <!-- الفص الأمامي -->
    <path class="sketch-thin" stroke-width="1.5" opacity="0.5"
          d="M-72,-52 C-60,-64 -42,-58 -36,-45 C-30,-33 -42,-22 -54,-28"/>
    <path class="sketch-thin" stroke-width="1" opacity="0.3"
          d="M-55,-65 C-42,-72 -28,-65 -24,-53 C-20,-41 -32,-33 -44,-40"/>
    <path class="sketch-thin" stroke-width="1.8" opacity="0.6"
          d="M-68,-25 C-58,-35 -44,-30 -40,-18 C-36,-8 -48,0 -58,-8"/>

    <!-- الفص الأوسط -->
    <path class="sketch-thin" stroke-width="1.2" opacity="0.35"
          d="M-25,-60 C-12,-68 5,-60 8,-48 C10,-38 0,-30 -10,-38"/>
    <path class="sketch-thin" stroke-width="1.5" opacity="0.45"
          d="M-15,-30 C-2,-38 15,-30 18,-18 C20,-8 8,0 -2,-8"/>
    <path class="sketch-thin" stroke-width="1.3" opacity="0.4"
          d="M-5,5 C8,-3 22,5 20,18 C18,28 5,32 -5,24"/>

    <!-- الفص الخلفي -->
    <path class="sketch-thin" stroke-width="1.4" opacity="0.45"
          d="M25,-55 C38,-62 52,-52 52,-38 C52,-28 42,-22 32,-28"/>
    <path class="sketch-thin" stroke-width="1" opacity="0.3"
          d="M30,-15 C44,-22 56,-12 54,2 C52,12 42,16 34,8"/>
    <path class="sketch-thin" stroke-width="1.6" opacity="0.55"
          d="M25,20 C38,14 50,24 48,36 C46,44 36,46 30,38"/>
    <path class="sketch-thin" stroke-width="1" opacity="0.25"
          d="M10,35 C22,30 34,36 32,46 C30,52 20,52 15,46"/>

    <!-- الجذع -->
    <path class="sketch-thin" stroke-width="1" opacity="0.25"
          d="M-10,42 C5,38 20,42 25,48"/>

    <!-- نقاط عصبية (دوائر صغيرة بأسلوب الرسم اليدوي) -->
    <g fill="#1A1A1A">
      <circle cx="-45" cy="-35" r="2.5" opacity="0.55"/>
      <circle cx="-18" cy="-45" r="1.8" opacity="0.35"/>
      <circle cx="-30" cy="0" r="2.2" opacity="0.45"/>
      <circle cx="10" cy="-15" r="1.8" opacity="0.35"/>
      <circle cx="35" cy="-45" r="2.2" opacity="0.45"/>
      <circle cx="45" cy="0" r="1.8" opacity="0.3"/>
      <circle cx="15" cy="30" r="2.2" opacity="0.35"/>
      <circle cx="-40" cy="20" r="1.8" opacity="0.25"/>
    </g>

  </g>

  <!-- ═══ نقطة الليموني: العنصر اللامع الوحيد ═══ -->
  <circle cx="250" cy="145" r="7" fill="#DCE35B"/>
  <circle cx="250" cy="145" r="14" fill="none" stroke="#DCE35B" stroke-width="1" opacity="0.35"/>
  <circle cx="250" cy="145" r="22" fill="none" stroke="#DCE35B" stroke-width="0.6" opacity="0.15"/>

  <!-- ═══ الاسم ═══ -->
  <text x="250" y="330" text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="52" font-weight="bold" letter-spacing="10"
        fill="#1A1A1A">AGL</text>

  <!-- خط فاصل رفيع -->
  <line x1="165" y1="348" x2="335" y2="348" stroke="#1A1A1A" stroke-width="0.8" opacity="0.25"/>

  <!-- الوصف العربي -->
  <text x="250" y="380" text-anchor="middle"
        font-family="'Aref Ruqaa', 'Amiri', serif"
        font-size="16" fill="#5C5A64">العقل الهندسي المُتقن</text>

  <!-- الوصف الإنجليزي -->
  <text x="250" y="406" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', sans-serif"
        font-size="10" letter-spacing="4"
        fill="#9C9AA2">THE ENGINEERING MIND</text>

  <!-- توقيع القلم (تفصيلة فنية) -->
  <g transform="translate(55, 455) rotate(-12)" opacity="0.12">
    <rect x="0" y="0" width="3.5" height="24" rx="1" fill="#1A1A1A"/>
    <polygon points="0,24 3.5,24 1.75,32" fill="#1A1A1A"/>
  </g>
</svg>
